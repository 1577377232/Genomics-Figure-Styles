<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1120" viewBox="0 0 1800 1120" role="img" aria-labelledby="fig-title fig-desc">
<title id="fig-title">Operational classification of TE-mediated structural variants</title>
<desc id="fig-desc">Two proportional SV interval coverage examples. An SV with 85 percent TE coverage meets the strict greater-than-80-percent operational rule; an SV with 65 percent does not. TE coverage is calculated using the union of TE-annotated bases within the SV interval.</desc>
<rect x="0" y="0" width="1800" height="1120" rx="0" fill="#FFFFFF" stroke="none" stroke-width="0" />
<text x="900" y="78" font-family="Arial, Helvetica, sans-serif" font-size="40" font-weight="700" fill="#253246" text-anchor="middle" >Operational classification of TE-mediated structural variants</text>
<text x="900" y="126" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="500" fill="#697887" text-anchor="middle" >TE-covered fraction &gt; 80% of the called SV interval</text>
<g id="panel-a">
<rect x="65" y="205" width="790" height="630" rx="20" fill="#FBFCFE" stroke="#D7DEE7" stroke-width="2" />
<rect x="97" y="235" width="48" height="48" rx="12" fill="#3F8A76" stroke="none" stroke-width="0" />
<text x="121" y="268" font-family="Arial, Helvetica, sans-serif" font-size="27" font-weight="700" fill="#FFFFFF" text-anchor="middle" >A</text>
<text x="165" y="267" font-family="Arial, Helvetica, sans-serif" font-size="29" font-weight="700" fill="#253246" text-anchor="start" >Criterion met</text>
<text x="125" y="337" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="600" fill="#697887" text-anchor="start" >SV interval</text>
<text x="795" y="337" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="700" fill="#253246" text-anchor="end" >100 kb</text>
<line x1="125" y1="418" x2="795" y2="418" stroke="#253246" stroke-width="2" />
<line x1="125" y1="409" x2="125" y2="427" stroke="#253246" stroke-width="2" />
<line x1="795" y1="409" x2="795" y2="427" stroke="#253246" stroke-width="2" />
<rect x="125" y="440" width="134" height="92" rx="0" fill="#386C8C" stroke="#FFFFFF" stroke-width="2" />
<rect x="259" y="440" width="167.5" height="92" rx="0" fill="#7BB6AC" stroke="#FFFFFF" stroke-width="2" />
<rect x="426.5" y="440" width="100.5" height="92" rx="0" fill="#9689B9" stroke="#FFFFFF" stroke-width="2" />
<rect x="527" y="440" width="167.5" height="92" rx="0" fill="#B4AD74" stroke="#FFFFFF" stroke-width="2" />
<rect x="694.5" y="440" width="100.5" height="92" rx="0" fill="#E8EDF2" stroke="#FFFFFF" stroke-width="2" />
<g id="composition-labels"><text x="192" y="493" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="700" fill="#253246" text-anchor="middle" >LINE</text><text x="342.75" y="493" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="700" fill="#253246" text-anchor="middle" >LTR</text><text x="476.75" y="493" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="700" fill="#253246" text-anchor="middle" >SINE</text><text x="610.75" y="493" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="700" fill="#253246" text-anchor="middle" >DNA</text><text x="744.75" y="493" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="700" fill="#697887" text-anchor="middle" >Non-TE</text></g>
<line x1="661" y1="392" x2="661" y2="557" stroke="#E85B4A" stroke-width="3" stroke-dasharray="9 7"/>
<rect x="599" y="357" width="124" height="28" rx="7" fill="#FFFFFF" stroke="#E85B4A" stroke-width="1.5" />
<text x="661" y="377" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="700" fill="#E85B4A" text-anchor="middle" >80% cutoff</text>
<text x="125" y="594" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="600" fill="#697887" text-anchor="start" >0%</text>
<text x="795" y="594" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="600" fill="#697887" text-anchor="end" >100%</text>
<text x="460" y="643" font-family="Arial, Helvetica, sans-serif" font-size="36" font-weight="700" fill="#253246" text-anchor="middle" >85 kb / 100 kb = 85%</text>
<text x="460" y="683" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700" fill="#3F8A76" text-anchor="middle" >85% &gt; 80% threshold</text>
<rect x="280" y="725" width="360" height="58" rx="15" fill="#EAF4F0" stroke="none" stroke-width="0" />
<text x="460" y="762" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="700" fill="#3F8A76" text-anchor="middle" >TE-mediated SV</text>
</g>
<g id="panel-b">
<rect x="945" y="205" width="790" height="630" rx="20" fill="#FBFCFE" stroke="#D7DEE7" stroke-width="2" />
<rect x="977" y="235" width="48" height="48" rx="12" fill="#7A8492" stroke="none" stroke-width="0" />
<text x="1001" y="268" font-family="Arial, Helvetica, sans-serif" font-size="27" font-weight="700" fill="#FFFFFF" text-anchor="middle" >B</text>
<text x="1045" y="267" font-family="Arial, Helvetica, sans-serif" font-size="29" font-weight="700" fill="#253246" text-anchor="start" >Criterion not met</text>
<text x="1005" y="337" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="600" fill="#697887" text-anchor="start" >SV interval</text>
<text x="1675" y="337" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="700" fill="#253246" text-anchor="end" >100 kb</text>
<line x1="1005" y1="418" x2="1675" y2="418" stroke="#253246" stroke-width="2" />
<line x1="1005" y1="409" x2="1005" y2="427" stroke="#253246" stroke-width="2" />
<line x1="1675" y1="409" x2="1675" y2="427" stroke="#253246" stroke-width="2" />
<rect x="1005" y="440" width="134" height="92" rx="0" fill="#386C8C" stroke="#FFFFFF" stroke-width="2" />
<rect x="1139" y="440" width="134" height="92" rx="0" fill="#7BB6AC" stroke="#FFFFFF" stroke-width="2" />
<rect x="1273" y="440" width="67" height="92" rx="0" fill="#9689B9" stroke="#FFFFFF" stroke-width="2" />
<rect x="1340" y="440" width="100.5" height="92" rx="0" fill="#B4AD74" stroke="#FFFFFF" stroke-width="2" />
<rect x="1440.5" y="440" width="234.5" height="92" rx="0" fill="#E8EDF2" stroke="#FFFFFF" stroke-width="2" />
<g id="composition-labels"><text x="1072" y="493" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="700" fill="#253246" text-anchor="middle" >LINE</text><text x="1206" y="493" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="700" fill="#253246" text-anchor="middle" >LTR</text><text x="1306.5" y="493" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="700" fill="#253246" text-anchor="middle" >SINE</text><text x="1390.25" y="493" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="700" fill="#253246" text-anchor="middle" >DNA</text><text x="1557.75" y="493" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="700" fill="#697887" text-anchor="middle" >Non-TE</text></g>
<line x1="1541" y1="392" x2="1541" y2="557" stroke="#E85B4A" stroke-width="3" stroke-dasharray="9 7"/>
<rect x="1479" y="357" width="124" height="28" rx="7" fill="#FFFFFF" stroke="#E85B4A" stroke-width="1.5" />
<text x="1541" y="377" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="700" fill="#E85B4A" text-anchor="middle" >80% cutoff</text>
<text x="1005" y="594" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="600" fill="#697887" text-anchor="start" >0%</text>
<text x="1675" y="594" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="600" fill="#697887" text-anchor="end" >100%</text>
<text x="1340" y="643" font-family="Arial, Helvetica, sans-serif" font-size="36" font-weight="700" fill="#253246" text-anchor="middle" >65 kb / 100 kb = 65%</text>
<text x="1340" y="683" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700" fill="#7A8492" text-anchor="middle" >65% ≤ 80% threshold</text>
<rect x="1125" y="725" width="430" height="58" rx="15" fill="#F0F2F5" stroke="none" stroke-width="0" />
<text x="1340" y="762" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="700" fill="#7A8492" text-anchor="middle" >Not classified as TE-mediated SV</text>
</g>
<g id="legend"><rect x="250" y="895" width="26" height="20" rx="4" fill="#386C8C" stroke="#D7DEE7" stroke-width="1" />
<text x="287" y="912" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="600" fill="#253246" text-anchor="start" >LINE</text>
<rect x="425" y="895" width="26" height="20" rx="4" fill="#7BB6AC" stroke="#D7DEE7" stroke-width="1" />
<text x="462" y="912" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="600" fill="#253246" text-anchor="start" >LTR</text>
<rect x="600" y="895" width="26" height="20" rx="4" fill="#9689B9" stroke="#D7DEE7" stroke-width="1" />
<text x="637" y="912" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="600" fill="#253246" text-anchor="start" >SINE</text>
<rect x="775" y="895" width="26" height="20" rx="4" fill="#B4AD74" stroke="#D7DEE7" stroke-width="1" />
<text x="812" y="912" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="600" fill="#253246" text-anchor="start" >DNA</text>
<rect x="950" y="895" width="26" height="20" rx="4" fill="#E8EDF2" stroke="#D7DEE7" stroke-width="1" />
<text x="987" y="912" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="600" fill="#253246" text-anchor="start" >Non-TE sequence</text></g>
<line x1="65" y1="960" x2="1735" y2="960" stroke="#D7DEE7" stroke-width="2" />
<text x="65" y="1005" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="600" fill="#253246" text-anchor="start" >TE coverage = union of TE-annotated bases within the SV interval ÷ SV length.</text>
<text x="65" y="1045" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="400" fill="#697887" text-anchor="start" >Overlapping TE annotations are counted once. Segment order is illustrative; widths represent coverage proportions, not genomic coordinates.</text>
<text x="65" y="1080" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="400" fill="#697887" text-anchor="start" >This is an operational overlap-based label; sequence overlap alone does not prove the causal mechanism of SV formation.</text>
</svg>