<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="250" viewBox="0 0 1400 250" role="img" aria-labelledby="te-v-title te-v-desc">
  <title id="te-v-title">SV interval classified as TEV when TE coverage exceeds 80 percent</title>
  <desc id="te-v-desc">One SV interval is shown as a bar. More than 80 percent of its sequence is TE-covered, while less than 20 percent is other sequence. The SV is therefore classified as a TE-mediated variant, abbreviated TEV.</desc>
  <rect width="1400" height="250" fill="#FFFFFF"/>
  <g id="heading">
    <text x="700" y="48" text-anchor="middle" dominant-baseline="middle"
      font-family="Georgia, 'Times New Roman', serif" font-size="43" font-weight="700"
      letter-spacing="0.25" fill="#253246">SV interval → <tspan fill="#E85B4A">TEV</tspan></text>
  </g>
  <g id="sv-interval">
    <text x="525" y="93" text-anchor="middle" dominant-baseline="middle"
      font-family="Georgia, 'Times New Roman', serif" font-size="24" font-weight="600"
      fill="#253246">SV sequence</text>
    <rect x="70" y="119" width="930" height="76" rx="14" ry="14"
      fill="#FBE5E1" stroke="#E85B4A" stroke-width="4" stroke-linejoin="round"/>
    <path d="M832 119 V195" fill="none" stroke="#FFFFFF" stroke-width="4"/>
    <path d="M832 119 H986 Q1000 119 1000 133 V181 Q1000 195 986 195 H832 Z"
      fill="#EEF1F4" stroke="none"/>
    <text x="451" y="158" text-anchor="middle" dominant-baseline="middle"
      font-family="Georgia, 'Times New Roman', serif" font-size="31" font-weight="600"
      fill="#253246">TE-covered sequence (&gt;80%)</text>
    <text x="916" y="158" text-anchor="middle" dominant-baseline="middle"
      font-family="Georgia, 'Times New Roman', serif" font-size="22" font-weight="600"
      fill="#697887">Other (&lt;20%)</text>
  </g>
  <g id="classification-arrow" fill="none" stroke="#253246" stroke-width="3.5"
    stroke-linecap="round" stroke-linejoin="round">
    <path d="M1024 157 H1081"/>
    <path d="M1067 145 L1081 157 L1067 169" />
  </g>
  <g id="tev-label">
    <rect x="1103" y="119" width="227" height="76" rx="15" ry="15"
      fill="#E85B4A" stroke="#E85B4A" stroke-width="3"/>
    <text x="1216.5" y="158" text-anchor="middle" dominant-baseline="middle"
      font-family="Georgia, 'Times New Roman', serif" font-size="38" font-weight="700"
      letter-spacing="0.5" fill="#FFFFFF">TEV</text>
  </g>
</svg>
