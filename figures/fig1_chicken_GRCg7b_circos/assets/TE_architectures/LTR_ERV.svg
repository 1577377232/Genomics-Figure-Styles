<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="250" viewBox="0 0 1400 250" role="img" aria-labelledby="ltr-erv-svg-title ltr-erv-svg-desc">
  <title id="ltr-erv-svg-title">LTR transposable element architecture</title>
  <desc id="ltr-erv-svg-desc">Editable schematic architecture for a representative chicken LTR element. Modules are not drawn to sequence scale.</desc>
