<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1060" viewBox="0 0 1400 1060" role="img" aria-labelledby="fourup-title fourup-desc">
<title id="fourup-title">Four representative chicken transposable element architectures</title>
<desc id="fourup-desc">Four editable schematic rows: LINE, LTR, SINE and TIR-type DNA transposon.</desc>
